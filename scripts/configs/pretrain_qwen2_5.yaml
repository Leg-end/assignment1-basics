# hydra:
#   run:
#     dir: ./my_output_dir  # save outputs to custom dir

root_dir: ${hydra:runtime.cwd}

dataset_name: TinyStories     # `TinyStories` or `owt`, change as needed
model_type: qwen2_5
exp_name: ${model_type}_${dataset_name}
dat_dir: ${root_dir}/data/${dataset_name}/dat

vocab_size_map:
  TinyStories: 10_000
  owt: 32_000
  
training:
  train_data_path: ${dat_dir}/train.dat
  valid_data_path: ${dat_dir}/valid.dat

  run_id: Pretrain-QWen2_5-LLM-Pre-Norm-RoPE
  experiment_config:
    name: ${exp_name}
  seed: 1234
  dtype: float32
  compile: false
  save_path: "checkpoints/${exp_name}" # save path for both first train and resume train
  gpu_id: 7
  lr: 0.001
  min_lr: 0.0002
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  batch_size: 96
  context_length: 256
  train_steps: 2000
  clip_grad_norm: 1.0
  warmup_iters: 100
  cosine_iters: 2000
  val_interval: 100
  val_batches: 20
  prompts:
  - The hotel’s high-ceilinged lobby resembles that of a ski resort
  - On the evening of Oct. 12, couples and families dressed
  - Yang looked up at Blake
  max_new_tokens: 256  # 256 * 4
  temperature: 0.8
  top_k: null
  top_p: 0.9
  repetition_penalty: 1.0
  save_interval: 500
  resume_checkpoint: null   # load checkpoint from current hydra run dir
  gradient_accumulation_steps: 1

model:
  architectures:
    - Qwen2ForCausalLM
  attention_dropout: 0.0
  bos_token_id: 151643
  eos_token_id: 151645
  hidden_act: silu
  hidden_size: 128 # 896
  initializer_range: 0.02
  intermediate_size: 384 # 4864
  max_position_embeddings: 512 # 32768
  max_window_layers: 21
  model_type: qwen2
  num_attention_heads: 8 # 14
  num_hidden_layers: 8 # 24
  num_key_value_heads: 2
  rms_norm_eps: 1e-06
  rope_theta: 1000000.0
  sliding_window: 512 # 32768
  tie_word_embeddings: true
  torch_dtype: bfloat16
  transformers_version: 4.43.1
  use_cache: true
  use_sliding_window: false
  vocab_size: ${vocab_size_map.${dataset_name}} # 151936

## only used for pretrain Qwen
dataset_split: train          # `train` or `valid`, change as needed
tokenizer_dir: ${root_dir}/tokenizers/${dataset_name}_${dataset_split} # save path for tokenizer
tokenizer:
  vocab_path: ${tokenizer_dir}/vocab.pkl
  merges_path: ${tokenizer_dir}/merges.pkl
  special_tokens: ["<|endoftext|>"]