# hydra:
#   run:
#     dir: ./my_output_dir  # save outputs to custom dir

root_dir: ${hydra:runtime.cwd}

exp_name: cs336_lm_TinyStories
dataset_name: TinyStories     # `TinyStories` or `owt`, change as needed
dat_dir: ${root_dir}/data/${dataset_name}/dat

vocab_size_map:
  TinyStories: 10_000
  owt: 32_000

training:
  train_data_path: ${dat_dir}/train.dat
  valid_data_path: ${dat_dir}/valid.dat

  run_id: Pretrain-Baseline-LLM-Post-Norm
  seed: 1234
  dtype: float32
  compile: false
  save_path: "checkpoints/${exp_name}" # save path for both first train and resume train
  gpu_id: 7
  lr: 0.0005
  min_lr: 0.0001
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  batch_size: 32
  context_length: 256
  train_steps: 5000
  clip_grad_norm: 1.0
  warmup_iters: 500
  cosine_iters: 5000
  val_interval: 100
  val_batches: 20
  save_interval: 1000
  resume_checkpoint: null   # load checkpoint from current hydra run dir
  gradient_accumulation_steps: 1

model_type: cs336_lm
model:
  vocab_size: ${vocab_size_map.${dataset_name}}
  context_length: 256
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0
tokenizer_dir: ${root_dir}/tokenizers/${dataset_name}_train/ # save path for tokenizer
tokenizer:
  vocab_path: ${tokenizer_dir}/vocab.pkl
  merges_path: ${tokenizer_dir}/merges.pkl
  special_tokens: ["<|endoftext|>"]
